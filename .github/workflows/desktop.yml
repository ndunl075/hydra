name: Windows desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/desktop.yml'
      - 'desktop/**'
      - 'scripts/desktop*'
      - 'scripts/build.mjs'
      - 'scripts/smoke.mjs'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'webview/**'
      - 'themes/**'
      - 'media/**'
      - 'native/**'
      - 'hydra-logo.png'

permissions:
  contents: read
  actions: read

jobs:
  desktop:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure native Spectre build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installerDir = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer'
          $vswhere = Join-Path $installerDir 'vswhere.exe'
          $vsPath = & $vswhere -latest -products '*' -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw 'Visual Studio 2022 C++ toolchain is missing.' }
          $components = @(
            'Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre',
            'Microsoft.VisualStudio.Component.VC.ATL.Spectre',
            'Microsoft.VisualStudio.Component.VC.ATLMFC.Spectre'
          )
          $ready = & $vswhere -latest -products '*' -version '[17.0,18.0)' -requires $components -property installationPath
          if ($ready -ne $vsPath) {
            $installerArgs = @('modify', '--installPath', ('"' + $vsPath + '"'), '--quiet', '--norestart')
            foreach ($component in $components) { $installerArgs += @('--add', $component) }
            # setup.exe has no --wait switch; PowerShell waits for the process tree.
            $install = Start-Process -FilePath (Join-Path $installerDir 'setup.exe') -ArgumentList $installerArgs -WorkingDirectory $env:RUNNER_TEMP -WindowStyle Hidden -Wait -PassThru
            if ($install.ExitCode -notin @(0, 3010)) { throw "Visual Studio component install failed: $($install.ExitCode)" }
            $ready = & $vswhere -latest -products '*' -version '[17.0,18.0)' -requires $components -property installationPath
            if ($ready -ne $vsPath) { throw 'Spectre component verification failed.' }
          }
          "GYP_MSVS_VERSION=2022" >> $env:GITHUB_ENV
      - name: Verify prior tested upgrade artifact provenance
        id: upgrade-baseline
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const baseline = JSON.parse(fs.readFileSync('desktop/upgrade-baseline.json', 'utf8'));
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: baseline.runId });
            if (run.conclusion !== 'success' || run.head_sha !== baseline.headSha || run.path !== '.github/workflows/desktop.yml') throw new Error('Pinned prior installer run has not passed the exact expected Windows workflow/head.');
            const { data: artifact } = await github.rest.actions.getArtifact({ ...context.repo, artifact_id: baseline.artifactId });
            if (artifact.expired || artifact.name !== baseline.artifactName || artifact.digest !== baseline.artifactDigest || artifact.workflow_run?.id !== baseline.runId || artifact.workflow_run?.head_sha !== baseline.headSha) throw new Error('Pinned prior installer artifact is expired or its provenance changed. Revalidate a replacement baseline explicitly.');
            core.setOutput('run-id', String(baseline.runId));
            core.setOutput('artifact-id', String(baseline.artifactId));
      - name: Download pinned prior tested installer
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.upgrade-baseline.outputs.run-id }}
          artifact-ids: ${{ steps.upgrade-baseline.outputs.artifact-id }}
          merge-multiple: true
          path: .desktop/upgrade-prior
      - run: npm.cmd ci
      - name: Verify native Authenticode boundary with signed Windows fixture
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\desktop-native-verifier-test.ps1
      - name: Verify native operation path and replacement locks
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\desktop-native-locked-path-test.ps1
      - run: npm.cmd run desktop:build
        env:
          # Upstream ripgrep uses GitHub's release API; avoid shared-runner anonymous limits.
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm.cmd run desktop:smoke
      - run: npm.cmd run desktop:installer
      - name: Verify installer lifecycle on disposable runner
        shell: pwsh
        run: ./scripts/desktop-installer-test.ps1 -InstallerPath .desktop/code-oss/.build/win32-x64/user-setup/HydraSetup.exe
      - name: Verify distinct-version upgrade on disposable runner
        shell: pwsh
        run: ./scripts/desktop-upgrade-test.ps1 -PriorInstallerPath .desktop/upgrade-prior/HydraSetup.exe -InstallerPath .desktop/code-oss/.build/win32-x64/user-setup/HydraSetup.exe -BuiltAppPath .desktop/VSCode-win32-x64
      - name: Upload tested user installer
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-win32-x64-user-installer
          path: .desktop/code-oss/.build/win32-x64/user-setup/HydraSetup.exe
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload installer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-installer-test-logs
          path: .desktop/installer-test-logs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-upgrade-test-logs
          path: .desktop/upgrade-test-logs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload standalone editor
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-win32-x64
          path: .desktop/VSCode-win32-x64/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
